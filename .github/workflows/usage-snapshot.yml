name: Usage Snapshot

# 零遥测的使用信号：每天把 Release 资产的累计下载数追加到 usage-data 分支的 CSV。
# latest.json 的下载数 ≈ 桌面应用启动次数（updater 每次启动拉取一次），EXE 的下载数 ≈ 安装量。
on:
  schedule:
    - cron: "30 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: usage-snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    name: Append release download counts
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Switch to the usage-data branch
        run: |
          if git ls-remote --exit-code --heads origin usage-data >/dev/null; then
            git fetch --depth=1 origin usage-data
            git checkout usage-data
          else
            git checkout --orphan usage-data
            git rm -rfq .
            printf 'date,tag,asset,download_count\n' > downloads.csv
          fi

      - name: Append today's counts
        run: |
          today="$(date -u +%F)"
          gh api "repos/${{ github.repository }}/releases" --paginate \
            --jq '.[] | .tag_name as $tag | .assets[] | [$tag, .name, .download_count] | @csv' \
            | sed "s/^/\"$today\",/" >> downloads.csv

          {
            echo "## Release downloads on $today"
            echo
            echo "| asset | total |"
            echo "|---|---|"
            awk -F',' -v d="\"$today\"" '$1 == d && ($3 ~ /windows-x64\.exe"$/ || $3 == "\"latest.json\"") { gsub(/"/, "", $3); sum[$3] += $4 } END { for (a in sum) printf "| %s | %d |\n", a, sum[a] }' downloads.csv
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add downloads.csv
          git commit -m "data: release download counts $(date -u +%F)"
          git push origin usage-data
