[package]
name = "pay-dance"
version = "0.9.10"
description = "薪跳 · 桌面实时工资看板"
authors = ["Mr.Baoboer"]
license = "AGPL-3.0-only"
repository = "https://github.com/MrBaoboer/PayDance"
edition = "2024"

[lib]
name = "pay_dance_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2.5.4"
tauri-plugin-store = "2"
tauri-plugin-process = "2"
# 更新包是签名的裸 EXE，用不到 zip 解包；关掉 zip 特性免得把 zip 4.x（RUSTSEC-2026-0369）编进来
tauri-plugin-updater = { version = "2", default-features = false, features = ["rustls-tls", "system-proxy"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
